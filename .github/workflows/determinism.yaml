name: Determinism

# Every pull request, and main once it has moved. A push to a pull request's
# branch used to start the same jobs twice, once for the push and once for the
# pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress. A run
# on main always finishes, so every commit there keeps its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hash:
    strategy:
      # Milestone 14 recorded that there was no Windows runner. That was true
      # of the host it was written for and is not true of this one, so the
      # claim that a Windows build produces the same document is checked here
      # rather than declared unverified.
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: windows-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Two runs, one hash
        # bash on the Windows runner too: the script is the same one developers
        # run, and rewriting it per platform would test something else.
        shell: bash
        env:
          SBOMB_DETERMINISM_KEEP: determinism-documents
        run: scripts/determinism-check.sh > "determinism-${{ matrix.target }}.txt"
      - name: Keep the hash
        uses: actions/upload-artifact@v7
        with:
          name: determinism-${{ matrix.target }}
          path: determinism-${{ matrix.target }}.txt
      # The documents behind the hashes, so a disagreement in compare can be
      # diffed instead of guessed at. Named apart from determinism-*, which is
      # the pattern compare merges.
      - name: Keep the documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documents-${{ matrix.target }}
          path: determinism-documents/

  compare:
    needs: hash
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          merge-multiple: true
      - name: Every platform agrees
        shell: bash
        run: |
          set -euo pipefail
          # Each specification version is compared on its own. Two versions
          # produce two different documents by design, so pooling their hashes
          # would report that design as a portability failure. 3.0.1 is SPDX;
          # the version numbers of the two formats do not collide.
          status=0
          for version in 1.6 1.7 3.0.1; do
            # Trailing carriage returns would make two identical hashes compare
            # unequal, which is the one difference this job must not report.
            hashes=$(grep "portable SBOM $version SHA-256:" determinism-*.txt | awk '{print $NF}' | tr -d '\r' | sort -u)
            count=$(printf '%s\n' "$hashes" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "the platforms produced different $version documents:" >&2
              grep -H "portable SBOM $version SHA-256:" determinism-*.txt >&2
              status=1
              continue
            fi
            printf 'matching portable SBOM %s SHA-256: %s\n' "$version" "$hashes"
          done
          exit "$status"
