name: determinism

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hash:
    strategy:
      # Milestone 14 recorded that there was no Windows runner. That was true
      # of the host it was written for and is not true of this one, so the
      # claim that a Windows build produces the same document is checked here
      # rather than declared unverified.
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Two runs, one hash
        # bash on the Windows runner too: the script is the same one developers
        # run, and rewriting it per platform would test something else.
        shell: bash
        run: scripts/determinism-check.sh > "determinism-${{ matrix.target }}.txt"
      - name: Keep the hash
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.target }}
          path: determinism-${{ matrix.target }}.txt

  compare:
    needs: hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          merge-multiple: true
      - name: Every platform agrees
        shell: bash
        run: |
          set -euo pipefail
          # Trailing carriage returns would make two identical hashes compare
          # unequal, which is the one difference this job must not report.
          hashes=$(grep 'portable SBOM SHA-256:' determinism-*.txt | awk '{print $NF}' | tr -d '\r' | sort -u)
          count=$(printf '%s\n' "$hashes" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "the platforms produced different documents:" >&2
            grep -H 'portable SBOM SHA-256:' determinism-*.txt >&2
            exit 1
          fi
          printf 'matching portable SBOM SHA-256: %s\n' "$hashes"
