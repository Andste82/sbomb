name: determinism

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  determinism:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run deterministic fixture check
        run: scripts/determinism-check.sh > "determinism-${{ matrix.arch }}.txt"
      - name: Upload deterministic hash
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.arch }}
          path: determinism-${{ matrix.arch }}.txt

  compare:
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          merge-multiple: true
      - name: Compare architecture hashes
        shell: bash
        run: |
          set -euo pipefail
          hashes=$(grep 'portable SBOM SHA-256:' determinism-*.txt | awk '{print $NF}' | sort -u)
          test "$(printf '%s\n' "$hashes" | wc -l)" -eq 1
          printf 'matching portable SBOM SHA-256: %s\n' "$hashes"
