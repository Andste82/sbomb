name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release from
        required: true
        type: string

# The only workflow in this repository that publishes anything, and therefore
# the only one that needs more than read access.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # scripts/release.sh derives the version from git describe, which
          # needs the tags and enough history to reach one.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      # The gate runs on every push already; these are the two properties that
      # are specific to a release and would otherwise be claimed rather than
      # checked.
      - name: Reproducible
        run: scripts/release.sh --check-reproducible

      - name: Build
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: scripts/release.sh build

      - name: Version matches the tag
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          reported=$(dist/"${VERSION#v}"/sbomb-linux-amd64 version)
          expected="sbomb ${VERSION#v}"
          if [ "$reported" != "$expected" ]; then
            echo "the binary reports '$reported', the tag says '$expected'" >&2
            exit 1
          fi

      - name: Checksums cover everything
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd dist/"${VERSION#v}"
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      # A tool that reports what is inside somebody else's build has to be able
      # to report what is inside its own. The document beside each binary is
      # derived from the module evidence that binary's linker recorded, so this
      # re-validates it from the published file rather than trusting that the
      # writer validated it.
      - name: Self-SBOMs validate
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          for document in dist/"${VERSION#v}"/*.cdx.json; do
            dist/"${VERSION#v}"/sbomb-linux-amd64 validate --input "$document"
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          {
            printf 'Static, single-file executables for linux/amd64, linux/arm64,\n'
            printf 'windows/amd64, darwin/amd64 and darwin/arm64, built with CGO_ENABLED=0\n'
            printf -- '-trimpath -buildvcs=false and verified to build reproducibly.\n\n'
            printf 'The macOS builds are not signed or notarized. A browser download is\n'
            printf 'quarantined; remove it with `xattr -d com.apple.quarantine ./sbomb-darwin-*`\n'
            printf 'or fetch with curl.\n\n'
            printf 'Each binary ships a CycloneDX 1.6 SBOM of itself, derived from the\n'
            printf 'module evidence its linker recorded.\n\n'
            printf 'Verify a download against `SHA256SUMS` before running it:\n\n'
            printf '```\nsha256sum --check --ignore-missing SHA256SUMS\n```\n\n'
            printf 'See docs/CHANGELOG.md for what changed.\n'
          } > "$notes"
          gh release create "$VERSION" \
            --title "sbomb $VERSION" \
            --notes-file "$notes" \
            dist/"${VERSION#v}"/sbomb-linux-amd64 \
            dist/"${VERSION#v}"/sbomb-linux-amd64.cdx.json \
            dist/"${VERSION#v}"/sbomb-linux-arm64 \
            dist/"${VERSION#v}"/sbomb-linux-arm64.cdx.json \
            dist/"${VERSION#v}"/sbomb-windows-amd64.exe \
            dist/"${VERSION#v}"/sbomb-windows-amd64.exe.cdx.json \
            dist/"${VERSION#v}"/sbomb-darwin-amd64 \
            dist/"${VERSION#v}"/sbomb-darwin-amd64.cdx.json \
            dist/"${VERSION#v}"/sbomb-darwin-arm64 \
            dist/"${VERSION#v}"/sbomb-darwin-arm64.cdx.json \
            dist/"${VERSION#v}"/SHA256SUMS

  # Called rather than triggered: the release exists by now, and a workflow
  # started from `gh release create` would never run at all, because GitHub
  # does not start workflows from events the default token created.
  smoke:
    needs: publish
    uses: ./.github/workflows/smoke-test.yaml
    with:
      version: ${{ needs.publish.outputs.version }}
