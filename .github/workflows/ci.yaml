name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The universal gate from docs/dev/README.md. Every milestone must
  # leave the repository in a state where all four of these succeed.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Builds without network
        run: go build -mod=vendor ./...
      - name: Builds
        run: go build ./...
      - name: Vets clean
        run: go vet ./...
      - name: Tests pass
        run: go test ./...
      - name: Formatted
        run: |
          # Only our own packages; vendor/ is third-party source.
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  # Release binaries are built with CGO_ENABLED=0 (specification section 37.1),
  # which is also the devcontainer default -- but the race detector needs cgo,
  # so this job overrides it rather than dropping the requirement.
  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: No data races
        run: go test -race ./...

  # The fixture corpus is a committed golden artifact. CI verifies that it is
  # complete and free of host paths; regenerating it needs the pinned
  # toolchains of the devcontainer and is therefore a developer task.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Complete
        run: tools/fixtures/regen.sh --check
      - name: Free of host paths
        run: go test ./tools/fixtures/...
      - name: Unchanged by the test suite
        run: |
          go test ./... > /dev/null
          if ! git diff --quiet -- testdata/fixtures; then
            echo "the test suite modified the fixture corpus:" >&2
            git diff --stat -- testdata/fixtures >&2
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- testdata/fixtures)
          if [ -n "$untracked" ]; then
            echo "the test suite left files in the fixture corpus:" >&2
            echo "$untracked" >&2
            exit 1
          fi

  # Section 31 states a budget; this measures it. The 10 000 unit row runs on
  # every push because it costs seconds. The 50 000 unit row needs a 200 MB map
  # and a minute of wall time, so it is run on demand:
  #   go test -tags perf ./test/perf/ -timeout 15m
  performance-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 10 000 translation units within budget
        run: go test -tags perf ./test/perf/ -timeout 10m -units 10000 -map-bytes 41943040

  # The findings catalogue in the user documentation is generated from appendix
  # A and annotated with what the code emits. Unlike the SPDX list this depends
  # on nothing external, so drift is a fault and blocks the pull request.
  # The findings catalogue is generated from appendix A and annotated with what
  # the code emits; the documented configurations are run through the loader.
  # Both keep a document from describing something other than the tool.
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Findings match the code and the specification
        run: go run ./tools/findingsdoc --check
      - name: Properties match the code and the specification
        run: go run ./tools/propertydoc --check
      - name: Documented configurations load
        run: go run ./tools/docexamples

  # The SPDX license list changes upstream, so drift here is information, not
  # a reason to block a pull request. It is checked separately for that reason.
  spdx-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Matches the upstream SPDX list
        run: go run -mod=mod ./tools/spdxgen --check

  # The end-to-end CMake integration is behind a build tag because it needs a
  # real cmake on PATH.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Against a real toolchain
        run: go test -tags e2e ./test/...

  # The install script is the first thing a new user runs, so it is tested the
  # way they run it: against the real published release, on the platforms it
  # claims to support. Anything less tests a mock of the thing that breaks.
  install-script:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Clean, and parses as POSIX sh
        if: runner.os == 'Linux'
        run: |
          sh -n install.sh
          shellcheck install.sh
      - name: Installs the latest release
        run: |
          set -eu
          ./install.sh --bin-dir "$PWD/latest-bin" --with-sbom
          "$PWD/latest-bin/sbomb" version
          test -s "$PWD/latest-bin/sbomb.cdx.json"
      - name: Installs a pinned version, with and without the v
        run: |
          set -eu
          ./install.sh --version v0.11.0 --bin-dir "$PWD/pinned-bin"
          "$PWD/pinned-bin/sbomb" version | grep -q '0\.11\.0'
          ./install.sh --version 0.11.0 --bin-dir "$PWD/bare-bin"
          "$PWD/bare-bin/sbomb" version | grep -q '0\.11\.0'
      - name: Refuses a release that does not exist
        run: |
          set -eu
          if ./install.sh --version v0.0.0-nope --bin-dir "$PWD/nope-bin" 2>/dev/null; then
            echo "the installer accepted a release that does not exist" >&2
            exit 1
          fi
          test ! -e "$PWD/nope-bin/sbomb"

  # The other way in: FetchContent pulls the CMake bundle, which fetches the
  # binary for the host and defines sbomb_enable. Tested against a bundle built
  # here rather than a published one, so the path is checked before a release
  # carries it -- the binary it downloads is the real published release.
  cmake-fetchcontent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the bundle
        run: VERSION=v0.11.0 scripts/release.sh build
      - name: A consumer project fetches it and produces an SBOM
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/consumer"
          mkdir -p "$work/src"
          echo 'int main(void){return 0;}' > "$work/src/main.c"
          echo '{"project":{"name":"fc-demo"},"build":{"dir":"build"}}' > "$work/sbomb.json"
          cat > "$work/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.24)
          project(fc_demo C)
          include(FetchContent)
          FetchContent_Declare(sbomb URL file://$PWD/dist/0.11.0/sbomb-cmake.tar.gz)
          FetchContent_MakeAvailable(sbomb)
          add_executable(app src/main.c)
          sbomb_enable(TARGET app POLICY lenient CONFIG "\${CMAKE_SOURCE_DIR}/sbomb.json")
          EOF
          cmake -S "$work" -B "$work/build"
          cmake --build "$work/build"
          cmake --build "$work/build" --target sbomb
          test -s "$work/build/sbom/app.cdx.json"
          # The binary it fetched has to be the one for this host, and verified.
          test -x "$work/build/_sbomb/v0.11.0/sbomb-linux-amd64"
      - name: Without CONFIG, and without a default file, no --config is passed
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/noconfig"
          mkdir -p "$work/src"
          echo 'int main(void){return 0;}' > "$work/src/main.c"
          cat > "$work/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.20)
          project(noconfig C)
          list(APPEND CMAKE_MODULE_PATH "$PWD/cmake")
          include(Sbomb)
          add_executable(app src/main.c)
          add_library(stat STATIC src/main.c)
          sbomb_enable(TARGET app POLICY lenient)
          sbomb_enable(TARGET stat POLICY lenient)
          EOF
          cmake -S "$work" -B "$work/build" \
            -DSBOMB_EXECUTABLE="$PWD/dist/0.11.0/sbomb-linux-amd64" > "$work/configure.txt"
          # A cache default that leaks in when nobody asked for it turns every
          # project without that file into a build failure.
          if grep -q -- '--config' "$work/build/CMakeFiles/sbomb-app.dir/build.make"; then
            echo "a configuration was passed although none was named" >&2
            exit 1
          fi
          # A static library is archived, not linked, and carries no linker flags.
          grep -q "a STATIC_LIBRARY carries no linker flags" "$work/configure.txt"
          # One configure has to leave both, or the SBOM target would need to
          # re-configure before it could generate anything worth having.
          test -s "$work/build/compile_commands.json"
          ls "$work/build/.cmake/api/v1/reply/"index-*.json > /dev/null
          cmake --build "$work/build"
          cmake --build "$work/build" --target sbomb
          test -s "$work/build/sbom/app.cdx.json"
      - name: Including the module after a target is warned about
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/lateinclude"
          mkdir -p "$work/src"
          echo 'int main(void){return 0;}' > "$work/src/main.c"
          cat > "$work/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.20)
          project(late LANGUAGES C)
          add_executable(app src/main.c)
          list(APPEND CMAKE_MODULE_PATH "$PWD/cmake")
          include(Sbomb)
          sbomb_enable(TARGET app POLICY lenient)
          EOF
          cmake -S "$work" -B "$work/build" \
            -DSBOMB_EXECUTABLE="$PWD/dist/0.11.0/sbomb-linux-amd64" 2> "$work/err.txt" || true
          # Losing the compile database silently is the failure mode this
          # guards; the build still succeeds, so nothing else would notice.
          grep -q "include(Sbomb) comes after" "$work/err.txt"
      - name: A bundle with no version says so instead of guessing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/unversioned"
          mkdir -p "$work"
          cat > "$work/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.19)
          project(unversioned C)
          include("$PWD/cmake/SbombFetch.cmake")
          sbomb_fetch_binary()
          EOF
          if cmake -S "$work" -B "$work/build" 2>"$work/err.txt"; then
            echo "the source-tree bundle fetched something without a version" >&2
            exit 1
          fi
          grep -q "carries no version" "$work/err.txt"

  install-script-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installs the latest release
        shell: pwsh
        run: |
          ./install.ps1 -BinDir "$PWD/bin" -WithSbom
          & "$PWD/bin/sbomb.exe" version
          if (-not (Test-Path "$PWD/bin/sbomb.cdx.json")) { throw "no SBOM installed" }
      - name: Installs a pinned version
        shell: pwsh
        run: |
          ./install.ps1 -Version 0.11.0 -BinDir "$PWD/pinned"
          $reported = & "$PWD/pinned/sbomb.exe" version
          if ($reported -notmatch '0\.11\.0') { throw "reported $reported" }
