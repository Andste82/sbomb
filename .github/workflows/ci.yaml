name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The universal gate from docs/dev/README.md. Every milestone must
  # leave the repository in a state where all four of these succeed.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Builds without network
        run: go build -mod=vendor ./...
      - name: Builds
        run: go build ./...
      - name: Vets clean
        run: go vet ./...
      - name: Tests pass
        run: go test ./...
      - name: Formatted
        run: |
          # Only our own packages; vendor/ is third-party source.
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  # Release binaries are built with CGO_ENABLED=0 (specification section 37.1),
  # which is also the devcontainer default -- but the race detector needs cgo,
  # so this job overrides it rather than dropping the requirement.
  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: No data races
        run: go test -race ./...

  # The fixture corpus is a committed golden artifact. CI verifies that it is
  # complete and free of host paths; regenerating it needs the pinned
  # toolchains of the devcontainer and is therefore a developer task.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Complete
        run: tools/fixtures/regen.sh --check
      - name: Free of host paths
        run: go test ./tools/fixtures/...
      - name: Unchanged by the test suite
        run: |
          go test ./... > /dev/null
          if ! git diff --quiet -- testdata/fixtures; then
            echo "the test suite modified the fixture corpus:" >&2
            git diff --stat -- testdata/fixtures >&2
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- testdata/fixtures)
          if [ -n "$untracked" ]; then
            echo "the test suite left files in the fixture corpus:" >&2
            echo "$untracked" >&2
            exit 1
          fi

  # MSVC fixtures are generated on Windows because the compiler and linker
  # evidence cannot be produced by the Linux corpus job. The committed files
  # must be reproducible on the same runner class.
  msvc-corpus:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate MSVC fixtures
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'MSVC C++ tools were not found' }
          $drive = $env:GITHUB_WORKSPACE.Substring(0, 1).ToLowerInvariant()
          $directory = $env:GITHUB_WORKSPACE.Substring(2) -replace '\\', '/'
          $bashWorkspace = "/$drive$directory"
          $command = 'call "' + $install.Trim() + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 & bash -lc "cd ' + $bashWorkspace + '; tools/fixtures/regen.sh --only msvc-ninja"'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Committed MSVC fixtures are reproducible
        shell: pwsh
        run: git diff --exit-code -- testdata/fixtures/msvc-ninja

  # Section 31 states a budget; this measures it. The 10 000 unit row runs on
  # every push because it costs seconds. The 50 000 unit row needs a 200 MB map
  # and a minute of wall time, so it is run on demand:
  #   go test -tags perf ./test/perf/ -timeout 15m
  performance-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 10 000 translation units within budget
        run: go test -tags perf ./test/perf/ -timeout 10m -units 10000 -map-bytes 41943040

  # The findings catalogue in the user documentation is generated from appendix
  # A and annotated with what the code emits. Unlike the SPDX list this depends
  # on nothing external, so drift is a fault and blocks the pull request.
  # The findings catalogue is generated from appendix A and annotated with what
  # the code emits; the documented configurations are run through the loader.
  # Both keep a document from describing something other than the tool.
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Findings match the code and the specification
        run: go run ./tools/findingsdoc --check
      - name: Properties match the code and the specification
        run: go run ./tools/propertydoc --check
      - name: Documented configurations load
        run: go run ./tools/docexamples

      # A version written into the documentation is a version that is wrong one
      # release later, and it was: the FetchContent example pointed at a
      # release that never carried the asset it named. The documentation says
      # <sbomb-version> instead, and this is what keeps it that way. The
      # changelog is the exception -- there a version is the subject.
      - name: The documentation pins no version
        run: |
          set -euo pipefail
          files=$(git ls-files \
            'README.md' 'docs/*.md' 'docs/**/*.md' 'docs/site/*.html' \
            'install.sh' 'install.ps1' 'cmake/*.cmake' 'cmake/CMakeLists.txt' \
            | grep -v 'docs/CHANGELOG.md' | grep -v '^docs/dev/')
          # A release tag, not any three numbers: x.y.z preceded by v or by the
          # start of a word, so "CMake 3.24" and "CycloneDX 1.6" are untouched.
          if grep -nE 'v[0-9]+\.[0-9]+\.[0-9]+' $files; then
            echo "::error::a release version is written out above; use <sbomb-version>" >&2
            exit 1
          fi
          echo "no release version is written into the documentation"

  # The SPDX license list changes upstream, so drift here is information, not
  # a reason to block a pull request. It is checked separately for that reason.
  spdx-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Matches the upstream SPDX list
        run: go run -mod=mod ./tools/spdxgen --check

  # The end-to-end CMake integration is behind a build tag because it needs a
  # real cmake on PATH.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Against a real toolchain
        run: go test -tags e2e ./test/...

  # The install script is the first thing a new user runs, so it is tested the
  # way they run it: against the real published release, on the platforms it
  # claims to support. Anything less tests a mock of the thing that breaks.
  install-script:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Clean, and parses as POSIX sh
        if: runner.os == 'Linux'
        run: |
          sh -n install.sh
          shellcheck install.sh
      - name: Installs the latest release
        run: |
          set -eu
          ./install.sh --bin-dir "$PWD/latest-bin" --with-sbom
          "$PWD/latest-bin/sbomb" version
          test -s "$PWD/latest-bin/sbomb.cdx.json"
      - name: Installs a pinned version, with and without the v
        run: |
          set -eu
          ./install.sh --version v0.11.0 --bin-dir "$PWD/pinned-bin"
          "$PWD/pinned-bin/sbomb" version | grep -q '0\.11\.0'
          ./install.sh --version 0.11.0 --bin-dir "$PWD/bare-bin"
          "$PWD/bare-bin/sbomb" version | grep -q '0\.11\.0'
      - name: Refuses a release that does not exist
        run: |
          set -eu
          if ./install.sh --version v0.0.0-nope --bin-dir "$PWD/nope-bin" 2>/dev/null; then
            echo "the installer accepted a release that does not exist" >&2
            exit 1
          fi
          test ! -e "$PWD/nope-bin/sbomb"

  # The other way in: FetchContent pulls the CMake bundle, which fetches the
  # binary for the host and defines sbomb_enable. Tested against a bundle built
  # here rather than a published one, so the path is checked before a release
  # carries it -- the binary it downloads is the real published release.
  cmake-fetchcontent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the bundle
        run: VERSION=v0.11.0 scripts/release.sh build
      - name: A consumer project fetches it and produces an SBOM
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/consumer"
          mkdir -p "$work/src"
          echo 'int main(void){return 0;}' > "$work/src/main.c"
          echo '{"project":{"name":"fc-demo"},"build":{"dir":"build"}}' > "$work/sbomb.json"
          cat > "$work/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.24)
          project(fc_demo C)
          include(FetchContent)
          FetchContent_Declare(sbomb URL file://$PWD/dist/0.11.0/sbomb-cmake.tar.gz)
          FetchContent_MakeAvailable(sbomb)
          add_executable(app src/main.c)
          sbomb_enable(TARGET app POLICY lenient CONFIG "\${CMAKE_SOURCE_DIR}/sbomb.json")
          EOF
          cmake -S "$work" -B "$work/build"
          cmake --build "$work/build"
          cmake --build "$work/build" --target sbomb
          test -s "$work/build/sbom/app.cdx.json"
          # The binary it fetched has to be the one for this host, and verified.
          test -x "$work/build/_sbomb/v0.11.0/sbomb-linux-amd64"
      - name: Without CONFIG, and without a default file, no --config is passed
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/noconfig"
          mkdir -p "$work/src"
          echo 'int main(void){return 0;}' > "$work/src/main.c"
          cat > "$work/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.20)
          project(noconfig C)
          list(APPEND CMAKE_MODULE_PATH "$PWD/cmake")
          include(Sbomb)
          add_executable(app src/main.c)
          add_library(stat STATIC src/main.c)
          sbomb_enable(TARGET app POLICY lenient)
          sbomb_enable(TARGET stat POLICY lenient)
          EOF
          cmake -S "$work" -B "$work/build" \
            -DSBOMB_EXECUTABLE="$PWD/dist/0.11.0/sbomb-linux-amd64" > "$work/configure.txt"
          # A cache default that leaks in when nobody asked for it turns every
          # project without that file into a build failure.
          if grep -q -- '--config' "$work/build/CMakeFiles/sbomb-app.dir/build.make"; then
            echo "a configuration was passed although none was named" >&2
            exit 1
          fi
          # A static library is archived, not linked, and carries no linker flags.
          grep -q "a STATIC_LIBRARY carries no linker flags" "$work/configure.txt"
          # One configure has to leave both, or the SBOM target would need to
          # re-configure before it could generate anything worth having.
          test -s "$work/build/compile_commands.json"
          ls "$work/build/.cmake/api/v1/reply/"index-*.json > /dev/null
          cmake --build "$work/build"
          cmake --build "$work/build" --target sbomb
          test -s "$work/build/sbom/app.cdx.json"
      - name: Including the module after a target is warned about
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/lateinclude"
          mkdir -p "$work/src"
          echo 'int main(void){return 0;}' > "$work/src/main.c"
          cat > "$work/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.20)
          project(late LANGUAGES C)
          add_executable(app src/main.c)
          list(APPEND CMAKE_MODULE_PATH "$PWD/cmake")
          include(Sbomb)
          sbomb_enable(TARGET app POLICY lenient)
          EOF
          cmake -S "$work" -B "$work/build" \
            -DSBOMB_EXECUTABLE="$PWD/dist/0.11.0/sbomb-linux-amd64" 2> "$work/err.txt" || true
          # Losing the compile database silently is the failure mode this
          # guards; the build still succeeds, so nothing else would notice.
          grep -q "include(Sbomb) comes after" "$work/err.txt"
      - name: A bundle with no version says so instead of guessing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/unversioned"
          mkdir -p "$work"
          cat > "$work/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.19)
          project(unversioned C)
          include("$PWD/cmake/SbombFetch.cmake")
          sbomb_fetch_binary()
          EOF
          if cmake -S "$work" -B "$work/build" 2>"$work/err.txt"; then
            echo "the source-tree bundle fetched something without a version" >&2
            exit 1
          fi
          grep -q "carries no version" "$work/err.txt"

      # A self-signed certificate over HTTPS is a TLS-intercepting proxy in
      # miniature: the download fails for exactly the reason it would there.
      # Everything about naming a CA, and about switching the check off, is
      # decided by whether this server is accepted.
      - name: TLS verification, and the ways it is steered
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tls"
          mkdir -p "$work/rel/v9.9.9"
          printf 'stand-in binary\n' > "$work/rel/v9.9.9/sbomb-linux-amd64"
          ( cd "$work/rel/v9.9.9" && sha256sum sbomb-linux-amd64 > SHA256SUMS )
          bin_sha=$(cut -d' ' -f1 < "$work/rel/v9.9.9/SHA256SUMS")

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$work/srv.key" -out "$work/srv.pem" \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" 2>/dev/null

          # Only the base URL is redirected; the logic under test is the real one.
          sed 's#https://github.com/${SBOMB_FETCH_REPOSITORY}/releases/download/#https://localhost:8443/#' \
            cmake/SbombFetch.cmake > "$work/UnderTest.cmake"
          grep -q 'https://localhost:8443/' "$work/UnderTest.cmake"

          python3 - "$work" <<'PY' &
          import http.server, ssl, os, sys
          root = sys.argv[1]
          os.chdir(os.path.join(root, 'rel'))
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain(os.path.join(root, 'srv.pem'), os.path.join(root, 'srv.key'))
          httpd = http.server.HTTPServer(('127.0.0.1', 8443), http.server.SimpleHTTPRequestHandler)
          httpd.socket = ctx.wrap_socket(httpd.socket, server_side=True)
          httpd.serve_forever()
          PY
          srv=$!
          trap 'kill $srv 2>/dev/null || true' EXIT
          sleep 3

          cat > "$work/run.cmake" <<EOF
          set(CMAKE_BINARY_DIR "$work/bt")
          set(CMAKE_HOST_SYSTEM_NAME "Linux")
          set(CMAKE_HOST_SYSTEM_PROCESSOR "x86_64")
          include("$work/UnderTest.cmake")
          sbomb_fetch_binary()
          EOF

          run() {
            rm -rf "$work/bt"; mkdir -p "$work/bt"
            cmake -DSBOMB_FETCH_VERSION=v9.9.9 "$@" -P "$work/run.cmake" \
              > "$work/out.txt" 2>&1 && return 0 || return 1
          }

          # CMake wraps warning and error text, so a phrase can arrive split
          # across lines. Every assertion is made against the flattened output;
          # matching the raw file passes and fails for the wrong reasons.
          says() {
            tr '\n' ' ' < "$work/out.txt" | tr -s ' ' | grep -q "$1"
          }

          echo "1) nothing set: the peer is verified, so this must fail"
          if run; then echo "an unverified peer was accepted by default" >&2; exit 1; fi
          says "SSL peer certificate"

          echo "2) the certificate named: accepted"
          run -DSBOMB_FETCH_TLS_CAINFO="$work/srv.pem"
          says "checksum verified"

          echo "3) SBOMB_FETCH_TLS_VERIFY=OFF: accepted, and warned about"
          run -DSBOMB_FETCH_TLS_VERIFY=OFF
          says "TLS peer verification is off"
          says "Pin SBOMB_FETCH_SHA256"

          echo "4) off, but pinned: no warning, the pin is what holds"
          run -DSBOMB_FETCH_TLS_VERIFY=OFF -DSBOMB_FETCH_SHA256="$bin_sha"
          says "the pinned digest is what the download is held to"
          if says "CMake Warning"; then
            echo "a pinned download still warned" >&2; exit 1
          fi

          echo "5) ours beats CMake's: ON wins over CMAKE_TLS_VERIFY=OFF"
          if run -DSBOMB_FETCH_TLS_VERIFY=ON -DCMAKE_TLS_VERIFY=OFF; then
            echo "SBOMB_FETCH_TLS_VERIFY=ON did not win" >&2; exit 1
          fi
          says "SSL peer certificate"

          echo "6) an empty CMAKE_TLS_VERIFY is not a bool value"
          if run -DCMAKE_TLS_VERIFY=; then
            echo "an empty value disabled verification" >&2; exit 1
          fi
          says "SSL peer certificate"

          echo "7) a value that is neither: refused as such"
          if run -DSBOMB_FETCH_TLS_VERIFY=banana; then
            echo "a non-boolean was accepted" >&2; exit 1
          fi
          says "is not a boolean"

          # The cache path. Everything above verifies what arrives; these check
          # what is already there, which used to be nobody's job after the
          # first configure.
          ca="-DSBOMB_FETCH_TLS_CAINFO=$work/srv.pem"
          cached="$work/bt/_sbomb/v9.9.9/sbomb-linux-amd64"

          echo "8) a second configure re-hashes the cached binary"
          run $ca
          cmake -DSBOMB_FETCH_VERSION=v9.9.9 $ca -P "$work/run.cmake" \
            > "$work/out.txt" 2>&1
          says "still matches its digest"

          echo "9) a tampered cached binary is discarded and fetched again"
          echo tampered > "$cached"
          cmake -DSBOMB_FETCH_VERSION=v9.9.9 $ca -P "$work/run.cmake" \
            > "$work/out.txt" 2>&1
          says "discarding the cached sbomb-linux-amd64"
          says "checksum verified"
          grep -q "stand-in binary" "$cached"

          echo "10) same, with a pin and no SHA256SUMS to lean on"
          run $ca -DSBOMB_FETCH_SHA256="$bin_sha"
          echo tampered > "$cached"
          cmake -DSBOMB_FETCH_VERSION=v9.9.9 $ca -DSBOMB_FETCH_SHA256="$bin_sha" \
            -P "$work/run.cmake" > "$work/out.txt" 2>&1
          says "discarding the cached sbomb-linux-amd64"
          grep -q "stand-in binary" "$cached"

          echo "11) nothing to check against: not trusted either"
          run $ca
          rm -f "$work/bt/_sbomb/v9.9.9/SHA256SUMS"
          cmake -DSBOMB_FETCH_VERSION=v9.9.9 $ca -P "$work/run.cmake" \
            > "$work/out.txt" 2>&1
          says "there is nothing left to check it against"

  install-script-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installs the latest release
        shell: pwsh
        run: |
          ./install.ps1 -BinDir "$PWD/bin" -WithSbom
          & "$PWD/bin/sbomb.exe" version
          if (-not (Test-Path "$PWD/bin/sbomb.cdx.json")) { throw "no SBOM installed" }
      - name: Installs a pinned version
        shell: pwsh
        run: |
          ./install.ps1 -Version 0.11.0 -BinDir "$PWD/pinned"
          $reported = & "$PWD/pinned/sbomb.exe" version
          if ($reported -notmatch '0\.11\.0') { throw "reported $reported" }
