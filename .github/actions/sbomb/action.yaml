name: sbomb
description: Download and run a pinned sbomb release
inputs:
  repository:
    description: GitHub repository hosting the release
    required: false
    default: ${{ github.repository }}
  version:
    description: Release tag to download
    required: false
    default: v0.0.0
  build-dir:
    description: Build directory to read evidence from
    required: false
    default: ${{ github.workspace }}
  reproducible:
    description: Omit the timestamp and derive a stable serial number
    required: false
    default: "false"
  config:
    description: Optional sbomb JSON configuration file
    required: false
  policy:
    description: Optional policy profile
    required: false
    default: default
  output:
    description: CycloneDX output path
    required: false
    default: sbomb.cdx.json
  path-flavor:
    description: >
      Path comparison flavor (posix or windows). Empty means the host's, which
      is what a build on that host wants. Pin it when a document produced on
      Windows has to be byte-identical to one produced on Linux: the flavors
      differ in case sensitivity, so the same evidence otherwise yields two
      different documents by design (section 7.3).
    required: false
  token:
    description: >
      Token used to download the release. Needed only while the repository is
      private, where an unauthenticated download of a release asset is a 404
      rather than a 403. Pass an empty string to download anonymously.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Download sbomb
      shell: bash
      env:
        SBOMB_VERSION: ${{ inputs.version }}
        SBOMB_REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64) asset=sbomb-linux-amd64 ;;
          Linux/ARM64) asset=sbomb-linux-arm64 ;;
          Windows/X64) asset=sbomb-windows-amd64.exe ;;
          macOS/X64) asset=sbomb-darwin-amd64 ;;
          macOS/ARM64) asset=sbomb-darwin-arm64 ;;
          *) echo "Unsupported runner: ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        mkdir -p "$RUNNER_TEMP/sbomb"
        if [[ -n "${GH_TOKEN:-}" ]]; then
          # gh reaches a private repository's assets and a public one's alike.
          # The plain download URL below answers 404 for a private release,
          # which reads like a missing tag and is why this action could not run
          # against this repository at all.
          gh release download "$SBOMB_VERSION" --repo "$SBOMB_REPOSITORY" \
            --pattern "$asset" --pattern SHA256SUMS --dir "$RUNNER_TEMP/sbomb" --clobber
        else
          base="https://github.com/${SBOMB_REPOSITORY}/releases/download/${SBOMB_VERSION}"
          curl --fail --location --silent --show-error "$base/$asset" -o "$RUNNER_TEMP/sbomb/$asset"
          curl --fail --location --silent --show-error "$base/SHA256SUMS" -o "$RUNNER_TEMP/sbomb/SHA256SUMS"
        fi
        (cd "$RUNNER_TEMP/sbomb" && sha256sum --check --ignore-missing SHA256SUMS)
        chmod +x "$RUNNER_TEMP/sbomb/$asset"
        echo "SBOMB_ASSET=$asset" >> "$GITHUB_ENV"
    - name: Generate SBOM
      shell: bash
      env:
        SBOMB_BUILD_DIR: ${{ inputs.build-dir }}
        SBOMB_REPRODUCIBLE: ${{ inputs.reproducible }}
        SBOMB_CONFIG: ${{ inputs.config }}
        SBOMB_POLICY: ${{ inputs.policy }}
        SBOMB_OUTPUT: ${{ inputs.output }}
        SBOMB_PATH_FLAVOR: ${{ inputs.path-flavor }}
      run: |
        set -euo pipefail
        args=(generate --build-dir "$SBOMB_BUILD_DIR" --output "$SBOMB_OUTPUT" --policy "$SBOMB_POLICY")
        if [[ -n "$SBOMB_CONFIG" ]]; then args+=(--config "$SBOMB_CONFIG"); fi
        if [[ -n "$SBOMB_PATH_FLAVOR" ]]; then args+=(--path-flavor "$SBOMB_PATH_FLAVOR"); fi
        if [[ "$SBOMB_REPRODUCIBLE" == "true" ]]; then args+=(--reproducible); fi
        "$RUNNER_TEMP/sbomb/$SBOMB_ASSET" "${args[@]}"